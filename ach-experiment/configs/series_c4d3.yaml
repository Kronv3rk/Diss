# Series C4d3: isolated telemetry lag d = 3 steps (no noise, no missing values).
# Supplementary series: the boundary on the telemetry delay is measured
# separately from noise and missing values (in C4c all three act together).
extends: base
name: C4d3
description: "Stationary load, telemetry lag d=3"
n_runs: 30

load:
  type: constant
  lambda: 1437.5

noise:
  sigma:  0.0
  lag:    3
  p_miss: 0.0

# Series C4d1: isolated telemetry lag d = 1 steps (no noise, no missing values).
# Supplementary series: the boundary on the telemetry delay is measured
# separately from noise and missing values (in C4c all three act together).
extends: base
name: C4d1
description: "Stationary load, telemetry lag d=1"
n_runs: 30

load:
  type: constant
  lambda: 1437.5

noise:
  sigma:  0.0
  lag:    1
  p_miss: 0.0
